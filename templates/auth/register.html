{% extends 'base.html' %}

{% block title %}Create Account | ADCONNECT{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-lg w-full space-y-8">
        <!-- Header -->
        <div class="text-center">
            <div class="w-12 h-12 rounded-2xl gradient-brand flex items-center justify-center text-white mx-auto shadow-md">
                <i class="fa-solid fa-user-plus text-xl"></i>
            </div>
            <h2 class="mt-4 text-2xl font-extrabold text-slate-900">Join ADCONNECT</h2>
            <p class="mt-1 text-xs text-slate-500">Choose your role to start creating or booking video advertisements</p>
        </div>

        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
            <form method="POST" action="{{ url_for('register') }}" class="space-y-5">
                <!-- Role Selector Buttons -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">I want to:</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="relative flex flex-col p-4 rounded-xl border-2 border-indigo-600 bg-indigo-50/40 cursor-pointer role-option-label" id="role-customer-box">
                            <input type="radio" name="role" value="customer" checked class="sr-only" onchange="toggleRoleSelect(this.value)">
                            <i class="fa-solid fa-briefcase text-xl text-indigo-600 mb-1"></i>
                            <span class="text-sm font-bold text-slate-900">Hire Creators</span>
                            <span class="text-[11px] text-slate-500">I am a brand, agency, or business</span>
                        </label>

                        <label class="relative flex flex-col p-4 rounded-xl border border-slate-200 hover:border-slate-300 cursor-pointer role-option-label" id="role-creator-box">
                            <input type="radio" name="role" value="creator" class="sr-only" onchange="toggleRoleSelect(this.value)">
                            <i class="fa-solid fa-video text-xl text-slate-400 mb-1"></i>
                            <span class="text-sm font-bold text-slate-900">Offer Video Services</span>
                            <span class="text-[11px] text-slate-500">I am a 3D/UGC video producer</span>
                        </label>
                    </div>
                </div>

                <!-- Full Name -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name *</label>
                    <input type="text" name="full_name" required placeholder="e.g. Sarah Jenkins"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address *</label>
                    <input type="email" name="email" required placeholder="sarah@example.com"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password *</label>
                    <input type="password" name="password" required placeholder="Minimum 6 characters"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Company / Studio Name -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Company / Studio</label>
                        <input type="text" name="company_name" placeholder="Brand / Agency Name"
                               class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Location</label>
                        <input type="text" name="location" placeholder="e.g. New York, USA"
                               class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-bold text-white gradient-brand hover:opacity-95 shadow-md shadow-indigo-500/25 transition transform hover:-translate-y-0.5">
                        Complete Registration
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500">
                Already have an account?
                <a href="{{ url_for('login') }}" class="font-bold text-indigo-600 hover:text-indigo-500 ml-1">Sign In</a>
            </div>
        </div>
    </div>
</div>

<script>
function toggleRoleSelect(role) {
    const custBox = document.getElementById('role-customer-box');
    const creatBox = document.getElementById('role-creator-box');
    if (role === 'customer') {
        custBox.classList.add('border-2', 'border-indigo-600', 'bg-indigo-50/40');
        custBox.classList.remove('border-slate-200');
        custBox.querySelector('i').classList.add('text-indigo-600');
        custBox.querySelector('i').classList.remove('text-slate-400');

        creatBox.classList.remove('border-2', 'border-indigo-600', 'bg-indigo-50/40');
        creatBox.classList.add('border-slate-200');
        creatBox.querySelector('i').classList.remove('text-indigo-600');
        creatBox.querySelector('i').classList.add('text-slate-400');
    } else {
        creatBox.classList.add('border-2', 'border-indigo-600', 'bg-indigo-50/40');
        creatBox.classList.remove('border-slate-200');
        creatBox.querySelector('i').classList.add('text-indigo-600');
        creatBox.querySelector('i').classList.remove('text-slate-400');

        custBox.classList.remove('border-2', 'border-indigo-600', 'bg-indigo-50/40');
        custBox.classList.add('border-slate-200');
        custBox.querySelector('i').classList.remove('text-indigo-600');
        custBox.querySelector('i').classList.add('text-slate-400');
    }
}
</script>
{% endblock %}
