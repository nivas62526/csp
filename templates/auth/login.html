{% extends 'base.html' %}

{% block title %}Sign In | ADCONNECT{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <!-- Header -->
        <div class="text-center">
            <div class="w-14 h-14 rounded-2xl gradient-brand flex items-center justify-center text-white mx-auto shadow-md shadow-indigo-500/20">
                <i class="fa-solid fa-lock text-2xl"></i>
            </div>
            <h2 class="mt-4 text-2xl font-black text-slate-900">Sign In to ADCONNECT</h2>
            <p class="mt-1 text-xs text-slate-500">Access your dashboard, manage video campaigns, and chat with creators</p>
        </div>

        <!-- Standard Login Form -->
        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
            <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" name="email" required placeholder="you@company.com"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
                    </div>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-bold text-white gradient-brand hover:opacity-95 shadow-md shadow-indigo-500/25 transition transform hover:-translate-y-0.5">
                        Sign In
                    </button>
                </div>
            </form>

            <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
                Don't have an account yet?
                <a href="{{ url_for('register') }}" class="font-bold text-indigo-600 hover:text-indigo-500 ml-1">Create an Account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
